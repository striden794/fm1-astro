# Builds the firmware package and publishes an installer page for it on GitHub Pages, all in the browser.
# Run: Actions > "Site with installer" > Run workflow, give a version such as 0.1.
# Then open https://YOUR-NAME.github.io/YOUR-REPO/install/ in Chrome or Edge with the FM-1 on USB.
# Needs: the repository public (or a plan with Pages for private repos), and Settings > Pages > Source: GitHub Actions.
# Steps up to the build are fm1-samsara's dev.yml; the last steps are new and untested.
name: Site with installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: "a version X.Y, e.g. 0.1"
        required: true
        type: string
        default: "0.1"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Python packages, and FriBidi for the fonts (Pillow's raqm)
        run: |
          python3 -m pip install Pillow
          sudo apt-get install -y -qq libfribidi0
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"

      - name: JieLi Linux toolchain (pkgman.jieliapp.com)
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "toolchain: $(basename "$TC")"

      - name: JieLi AC79 SDK (gitee.com, a fixed tag)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test "$(git -C ~/fw-AC79_AIoT_SDK rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Build the release-style package
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]
          ./build.sh --release "$RELEASE"
          ls -l app/build

      - name: Make the site (installer, download, manual)
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          # tools/make_pages.py is put right here, whatever state this fork's copy is in
          python3 - <<'PYEOF'
          # makes tools/make_pages.py right whatever state the fork's copy is in (idempotent): the installer page needs
          # fm1ports.js (its PORT_NAMES), and the browser player (needs Emscripten) is optional
          import pathlib, sys
          p = pathlib.Path("tools/make_pages.py")
          s = p.read_text(encoding="utf-8")
          old_lib = '''    lib = strip_module((BASE / "web" / "fm1pkg.js").read_text(encoding="utf-8")) + "\\n" + \\
                  strip_module((BASE / "web" / "fm1ota.js").read_text(encoding="utf-8"))'''
          new_lib = '''    lib = "\\n".join(strip_module((BASE / "web" / f).read_text(encoding="utf-8"))
                              for f in ("fm1ports.js", "fm1pkg.js", "fm1ota.js"))'''
          old_emu = '''    if not (emu / "app.wasm").exists():
                  raise SystemExit("no app/build/emu/app.wasm: run ./build.sh --web (needs Emscripten)")
              shutil.copytree(emu, out / "emu", ignore=shutil.ignore_patterns("o2", "web", "*.o"))   # (not the build's leftovers)
          '''
          new_emu = '''    if (emu / "app.wasm").exists():
                  shutil.copytree(emu, out / "emu", ignore=shutil.ignore_patterns("o2", "web", "*.o"))   # (not the build's leftovers)
              else:
                  print("note: no app/build/emu/app.wasm (./build.sh --web needs Emscripten): the site has no browser player")
          '''
          did = []
          if "fm1ports.js" not in s:
              if old_lib not in s:
                  sys.exit("make_pages.py is not a version I know: send me the lines around 'fm1pkg.js'")
              s = s.replace(old_lib, new_lib); did.append("ports")
          if old_emu in s:
              s = s.replace(old_emu, new_emu); did.append("emulator optional")
          p.write_text(s, encoding="utf-8")
          print("make_pages.py patched:", did or "already right")
          PYEOF
          python3 tools/make_pages.py site "app/build/samsara-$RELEASE.fwsc" "$RELEASE"
          # the installer page must carry its ports helper (else it fails in the browser: PORT_NAMES is not defined)
          grep -q 'const PORT_NAMES' site/install/index.html || { echo "the installer page lacks PORT_NAMES: tools/make_pages.py is not right"; exit 1; }
          echo "installer page ok, version $RELEASE"
          ls -R site | head -50

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
