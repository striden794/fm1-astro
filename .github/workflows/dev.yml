# SAMSARA's development build: the package for trying on an FM-1 before a release, built on GitHub because JieLi's
# toolchain is Linux only. Run by hand (Actions, Run workflow, or `gh workflow run dev.yml`); the package is the
# run's "packages" artifact (`gh run download`). No attestation and no release: release.yml does those, from a tag,
# through the shared FM-1 builder. The steps are that builder's (zvenson/fm1-build, build.yml at v1), without its
# signing, so this also runs in a private repository.
name: Development build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "a version (X.Y) for a release-style package, or empty for a development one"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Python packages, and FriBidi for the fonts (Pillow's raqm)
        run: |
          python3 -m pip install Pillow
          sudo apt-get install -y -qq libfribidi0
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"

      - name: JieLi Linux toolchain (pkgman.jieliapp.com)
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "toolchain: $(basename "$TC")"

      - name: JieLi AC79 SDK (gitee.com, a fixed tag)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test "$(git -C ~/fw-AC79_AIoT_SDK rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          pkg=samsara
          mkdir -p build/dev-assets
          if [[ -n "$RELEASE" ]]; then
            [[ "$RELEASE" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
            ./build.sh --release "$RELEASE"
            cp "app/build/$pkg-$RELEASE.fwsc" build/dev-assets/
            cp "app/build/$pkg-$RELEASE.fwsc" "app/build/$pkg.fwsc"   # (the tests check the update path against it)
          else
            ./build.sh
            cp "app/build/$pkg.fwsc" build/dev-assets/
          fi
          cp "app/build/$pkg.bin" "build/dev-assets/$pkg-app.bin"
          cp app/build/firmware.json build/dev-assets/
          ls -l app/build build/dev-assets
          (cd build/dev-assets && sha256sum * | tee SHA256SUMS)

      - name: Tests (the instrument, the app in the simulator, the update path; no browser builds here)
        shell: bash
        run: sh tests/run_tests.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: always()
        with:
          name: packages
          path: |
            build/dev-assets/*
            app/build/tests/*.log
          if-no-files-found: error
